<style>
@font-face{font-family:"Gowun Batang";font-weight:700;font-display:swap;src:url(gowun-batang-bold.woff2) format("woff2")}
/* 컬러풀: 파랑→남색 머리띠와 저장 버튼, 초록 오늘 카드, 주홍 문자 버튼, 블루그레이 바탕 */
:root{
  --bg:#f0f1fa; --bg-grad:linear-gradient(180deg,#eceff9 0%,#f3f1fb 55%,#f9f7fd 100%);
  --surface:#fff; --ink:#1f1d33; --muted:#6c6a86; --line:#e3e4f2;
  --accent:#4f46e5; --on-accent:#fff; --container:#e0e7ff; --on-container:#1e1b6b;
  --head:linear-gradient(120deg,#2563eb,#4f46e5); --head-shadow:rgb(79 70 229 / .28);
  --grad:linear-gradient(120deg,#2563eb,#4f46e5); --grad-shadow:rgb(79 70 229 / .3);
  --sms:linear-gradient(120deg,#f97316,#ef4444); --sms-shadow:rgb(239 68 68 / .3);
  --hero:linear-gradient(120deg,#22c55e,#16a34a); --hero-ink:#fff; --hero-shadow:0 8px 22px rgb(22 163 74 / .3); --hero-a:#bbf7d0;
  --week-bg:#f3e8ff; --week-fg:#6b21a8; --day-bg:#ffedd5; --day-fg:#9a3412;
  --plain-bg:#e0e7ff; --plain-fg:#3730a3; --over-bg:#e9e9f1; --over-fg:#4b4b63;
  --danger:#ba1a1a; --ok:#15803d; --scrim:rgb(31 29 51 / .42);
  --av1:#ffedd5; --av2:#f3e8ff; --av3:#e0e7ff; --av4:#dcfce7; --av-ink:#2e2a4a;
  --shadow:0 3px 12px rgb(60 60 140 / .08);
  --display:"Gowun Batang","AppleMyungjo","Nanum Myeongjo",serif;
  --body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14151f; --bg-grad:linear-gradient(180deg,#161a2c 0%,#14151f 60%);
  --surface:#1f2030; --ink:#e8e8f6; --muted:#a2a2bb; --line:#30324a;
  --accent:#a5b4fc; --on-accent:#1e1b6b; --container:#312e81; --on-container:#e0e7ff;
  --head:linear-gradient(120deg,#1d4ed8,#4338ca); --head-shadow:rgb(0 0 0 / .3);
  --grad:linear-gradient(120deg,#2563eb,#4f46e5); --grad-shadow:rgb(0 0 0 / .3);
  --sms:linear-gradient(120deg,#ea580c,#dc2626); --sms-shadow:rgb(0 0 0 / .3);
  --hero:linear-gradient(120deg,#16a34a,#15803d); --hero-ink:#fff; --hero-shadow:none; --hero-a:#bbf7d0;
  --week-bg:#3b2350; --week-fg:#e9d5ff; --day-bg:#4a2a14; --day-fg:#fdba74;
  --plain-bg:#2a2d55; --plain-fg:#c7d2fe; --over-bg:#2c2d3e; --over-fg:#c5c6d8;
  --danger:#ffb4ab; --ok:#86efac; --scrim:rgb(0 0 0 / .55);
  --av1:#4a2a14; --av2:#3b2350; --av3:#2a2d55; --av4:#173a26; --av-ink:#f0f0fb;
  --shadow:none; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-text-size-adjust:100%}
body{min-height:100dvh;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bg-grad)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.appbar{background:var(--head);color:#fff;border-radius:0 0 24px 24px;box-shadow:0 8px 20px var(--head-shadow);
  padding:calc(env(safe-area-inset-top,0px) + 6px) max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.appbar .topbar{max-width:560px;margin:0 auto}
.page{max-width:560px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 110px) max(16px,env(safe-area-inset-left,0px))}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 2px}
.topbar h1{flex:1;margin:0;font-family:var(--display);font-size:1.5rem;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:rgb(255 255 255 / .22);display:grid;place-items:center;color:#fff;flex:none}
.iconbtn svg{width:22px;height:22px}

.hero{border-radius:24px;padding:18px 20px;background:var(--hero);color:var(--hero-ink);box-shadow:var(--hero-shadow);display:flex;flex-direction:column;gap:3px}
.hero .k{font-size:.82rem;opacity:.85}
.hero .v{font-family:var(--display);font-size:1.75rem;font-weight:700}
.hero .s{margin-top:6px;font-size:.82rem}

.banner{margin-top:12px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);padding:13px 14px;display:flex;gap:10px;align-items:center;font-size:.86rem;line-height:1.45}
.banner p{margin:0;flex:1}
.banner .x{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:4px 6px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0}

.h{font-family:var(--display);font-weight:700;font-size:1.12rem;margin:26px 2px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.h span{font-family:var(--body);font-weight:400;font-size:.82rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);font-size:.9rem;padding:6px 4px;line-height:1.5}

.card{width:100%;text-align:left;border:0;background:var(--surface);border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--av-ink);flex:none}
.a0{background:var(--av1)}.a1{background:var(--av2)}.a2{background:var(--av3)}.a3{background:var(--av4)}
.card .l{flex:1;min-width:0}
.card .n{font-weight:700;font-size:1rem}
.card .s{font-size:.8rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .r{text-align:right;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.badge{display:inline-block;border-radius:99px;padding:3px 10px;font-size:.74rem;font-weight:700;white-space:nowrap}
.b-week{background:var(--week-bg);color:var(--week-fg)}
.b-day{background:var(--day-bg);color:var(--day-fg)}
.b-plain{background:var(--plain-bg);color:var(--plain-fg)}
.b-over{background:var(--over-bg);color:var(--over-fg)}
.alert-row{display:flex;flex-direction:column;gap:0;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.alert-row .card{box-shadow:none;border-radius:0}
.alert-row .send{display:flex;align-items:center;justify-content:center;gap:6px;margin:0 12px 12px;padding:11px;border-radius:99px;background:var(--sms);color:#fff;box-shadow:0 4px 12px var(--sms-shadow);font-weight:700;text-decoration:none;font-size:.92rem}

.search{width:100%;border:0;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);padding:12px 18px;font-size:.95rem;margin-bottom:10px;outline-offset:0}
.search::placeholder{color:var(--muted)}

.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);border:0;border-radius:99px;background:var(--grad);color:#fff;font-weight:700;font-size:1rem;padding:15px 22px;box-shadow:0 8px 20px var(--grad-shadow);display:flex;align-items:center;gap:6px;z-index:5}

/* 새 창(전체 화면 시트) */
.sheet{position:fixed;inset:0;background:var(--bg-grad);z-index:20;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));
  background:var(--head);color:#fff;border-radius:0 0 22px 22px;box-shadow:0 6px 16px var(--head-shadow);margin-bottom:12px}
.sheet header h2{flex:1;margin:0;font-family:var(--display);font-weight:700;font-size:1.3rem}
.back{border:0;background:none;color:#fff;width:42px;height:42px;display:grid;place-items:center;border-radius:50%}
.back svg{width:24px;height:24px}
.sheet .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px))}
.sheet .inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}

.prof{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 6px}
.prof .av{width:76px;height:76px;font-size:1.9rem}
.prof .big{font-family:var(--display);font-weight:700;font-size:1.7rem;margin-top:6px}
.prof a{color:var(--muted);text-decoration:none;font-variant-numeric:tabular-nums}
.info{border-radius:20px;background:var(--surface);box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:.92rem;margin:0}
.info dt{color:var(--muted)} .info dd{margin:0;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.info dd b{color:var(--accent)}

.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-radius:99px;padding:14px 16px;font-weight:700;font-size:.97rem;text-decoration:none;text-align:center}
.btn.fill{background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--grad-shadow)}
.btn.sms{background:var(--sms);color:#fff;box-shadow:0 4px 12px var(--sms-shadow)}
.btn.tonal{background:var(--container);color:var(--on-container)}
.btn.out{background:var(--surface);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:var(--surface);color:var(--danger);box-shadow:inset 0 0 0 1px var(--line)}
.st{font-size:.8rem;color:var(--muted);text-align:center;margin:-4px 0 4px}
.st.ok{color:var(--ok)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.field{display:flex;flex-direction:column;gap:5px;background:var(--surface);border-radius:16px;padding:10px 14px 10px;box-shadow:var(--shadow)}
.field:focus-within{box-shadow:0 0 0 2px var(--accent)}
.field label{font-size:.76rem;color:var(--muted)}
.field input,.field textarea{border:0;background:none;padding:2px 0;font-size:1.02rem;outline:none;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:84px;line-height:1.5;font-size:.95rem}
.field .with-suf{display:flex;align-items:center;gap:8px}
.field .suf{color:var(--muted);flex:none}
.field.err{box-shadow:0 0 0 2px var(--danger)}
.errmsg{color:var(--danger);font-size:.78rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:99px;padding:7px 14px;font-size:.88rem}
.chip.on{background:var(--accent);color:var(--on-accent);box-shadow:none}
.hint{font-size:.88rem;background:var(--container);color:var(--on-container);border-radius:14px;padding:11px 14px;line-height:1.45}
.help{font-size:.82rem;color:var(--muted);line-height:1.55;margin:0 4px}
.sec{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:14px 2px 0}

.dialog-wrap{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.dialog{background:var(--bg);border-radius:26px;padding:22px 20px 16px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px}
.dialog h3{margin:0;font-family:var(--display);font-weight:700;font-size:1.2rem}
.dialog p{margin:0;font-size:.92rem;color:var(--muted);line-height:1.5;white-space:pre-line}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.dialog .acts button{border:0;background:none;color:var(--accent);font-weight:700;padding:10px 16px;border-radius:99px}
.dialog .acts button.go{background:var(--grad);color:#fff}
.dialog .acts button.go.danger{background:var(--danger);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:.9rem;display:flex;gap:14px;align-items:center;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgb(0 0 0 / .2)}
.toast button{border:0;background:none;color:var(--hero-a);font-weight:700;padding:2px}
.steps{margin:0;padding-left:1.3em;line-height:1.7;font-size:.92rem}
</style>
</head>
<body>
<header class="appbar">
  <div class="topbar">
    <h1 id="salonTitle">우리 미용실</h1>
    <button class="iconbtn" id="btnSettings" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
  </div>
</header>
<div class="page" id="home">
  <div class="hero">
    <span class="k" id="heroDate"></span>
    <span class="v" id="heroHeadline"></span>
    <span class="s" id="heroSub"></span>
  </div>

  <div class="banner" id="installBanner" hidden>
    <p>홈 화면에 추가하면 앱처럼 아이콘을 눌러 바로 열 수 있어요.</p>

<button class="fab" id="fab"><span aria-hidden="true">＋</span> 고객 등록</button>

<script>
"use strict";
/* ---------- 저장 ---------- */
const KEY = "salon.v1";
const DEFAULT_WEEK = "[{매장}] {이름}님, 안녕하세요. {날짜} {시간} 예약 안내드립니다. 일정 변경이 필요하시면 편하게 연락 주세요.";
const DEFAULT_DAY = "[{매장}] {이름}님, 오늘 {시간} 예약일입니다. 방문을 기다리겠습니다.";
let state = { salonName: "우리 미용실", weekTemplate: DEFAULT_WEEK, dayTemplate: DEFAULT_DAY, customers: [] };
let storageOk = true;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch (e) { storageOk = false; }
  if (!Array.isArray(state.customers)) state.customers = [];
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; }
  catch (e) { storageOk = false; toast("저장에 실패했어요. 개인정보 보호(시크릿) 모드인지 확인해 주세요."); }
}

/* ---------- 날짜 ---------- */
const WD = "일월화수목금토";
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysUntil = s => { const a = parse(s), b = parse(todayStr());
  return Math.round((Date.UTC(a.getFullYear(), a.getMonth(), a.getDate()) - Date.UTC(b.getFullYear(), b.getMonth(), b.getDate())) / 864e5); };
const pretty = s => { const d = parse(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
const prettyYear = s => { const d = parse(s); return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`; };
const stamp = ms => { const d = new Date(ms); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dLabel = d => d === 0 ? "오늘" : d > 0 ? `D-${d}` : `${-d}일 지남`;
/** 첫 예약일이 이미 지났으면 주기만큼 더해서 오늘 이후의 첫 예약일을 구한다. */
function firstUpcoming(first, weeks) { let d = first; const t = todayStr(); while (d < t) d = addDays(d, weeks * 7); return d; }

/* ---------- 알림 ---------- */
const KIND = { week: "1주일 전 알림", day: "예약일 알림" };
/** 오늘 보내야 할 알림. 1주일 전 알림은 D-7을 놓쳤더라도 예약 전날까지는 보여 준다. */
function due(c) {
  const d = daysUntil(c.nextDate);
  if (d === 0 && !isSent(c, "day")) return "day";
  if (d >= 1 && d <= 7 && !isSent(c, "week")) return "week";
  return null;
}
const isSent = (c, k) => (k === "week" ? c.weekSentFor : c.daySentFor) === c.nextDate;
function markSent(c, k) {
  const prev = { weekSentFor: c.weekSentFor, weekSentAt: c.weekSentAt, daySentFor: c.daySentFor, daySentAt: c.daySentAt };
  if (k === "week") { c.weekSentFor = c.nextDate; c.weekSentAt = Date.now(); }
  else { c.daySentFor = c.nextDate; c.daySentAt = Date.now(); }
  save();
  return () => { Object.assign(c, prev); save(); refreshAll(); };
}
function message(k, c) {
  return (k === "week" ? state.weekTemplate : state.dayTemplate)
    .replaceAll("{매장}", state.salonName).replaceAll("{이름}", c.name)
    .replaceAll("{날짜}", pretty(c.nextDate)).replaceAll("{시간}", c.time || "")
    .replace(/ {2,}/g, " ").trim();
}
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function smsHref(phone, text) {
  const num = (phone || "").replace(/[^\d+]/g, "");
  return `sms:${num}${isIOS ? "&" : "?"}body=${encodeURIComponent(text)}`;
}

/* ---------- 공통 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const find = id => state.customers.find(c => c.id === id);
const sorted = () => [...state.customers].sort((a, b) => a.nextDate.localeCompare(b.nextDate) || a.name.localeCompare(b.name));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
function hash(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.codePointAt(0)) | 0; return Math.abs(h); }
function initial(name) { const n = [...name.trim()]; return n.length === 3 ? n[1] : (n[0] || "?"); }
const avatar = (name, cls = "") => `<span class="av a${hash(name) % 4} ${cls}" aria-hidden="true">${esc(initial(name))}</span>`;
function badgeFor(c) {
  const d = daysUntil(c.nextDate);
  const cls = d === 0 ? "b-day" : d > 0 && d <= 7 ? "b-week" : d < 0 ? "b-over" : "b-plain";
  return `<span class="badge ${cls}">${dLabel(d)}</span>`;
}

let toastTimer;
function toast(text, undo) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = `<span>${esc(text)}</span>${undo ? '<button type="button">되돌리기</button>' : ""}`;
  if (undo) t.querySelector("button").onclick = () => { undo(); t.remove(); toast("되돌렸어요"); };
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), undo ? 6000 : 2600);
}

function confirmBox({ title, msg, ok = "확인", danger = false, onOk }) {
  const w = document.createElement("div");
  w.className = "dialog-wrap";
  w.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${msg ? `<p>${esc(msg)}</p>` : ""}
    <div class="acts"><button type="button" data-a="no">취소</button><button type="button" class="go ${danger ? "danger" : ""}" data-a="ok">${esc(ok)}</button></div></div>`;
  w.addEventListener("click", e => {
    const a = e.target.dataset.a;
    if (e.target === w || a === "no") w.remove();
    if (a === "ok") { w.remove(); onOk(); }
  });
  document.body.appendChild(w);
  w.querySelector(".go").focus();
}

/* ---------- 새 창(시트) 관리: 휴대폰 뒤로가기 버튼으로도 닫힌다 ---------- */
const stack = [];
const BACK_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>';
function openSheet(title, html, mount, refresh) {
  const s = document.createElement("section");
  s.className = "sheet"; s.setAttribute("role", "dialog"); s.setAttribute("aria-label", title);
  s.innerHTML = `<header><button class="back" type="button" aria-label="뒤로">${BACK_SVG}</button><h2>${esc(title)}</h2></header>
    <div class="body"><div class="inner">${html}</div></div>`;
  s.querySelector(".back").onclick = () => history.back();
  document.body.appendChild(s);
  stack.push({ el: s, refresh });
  history.pushState({ sheet: stack.length }, "");
  requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add("open")));
  mount?.(s);
  return s;
}
function popSheet() {
  const top = stack.pop();
  if (!top) return;
  top.el.classList.remove("open");
  setTimeout(() => top.el.remove(), 280);
  refreshAll();
}
window.addEventListener("popstate", popSheet);
const closeSheet = () => history.back();
function refreshAll() { renderHome(); for (const s of stack) s.refresh?.(); }

function addSamples() {

  const mk = (name, phone, next, weeks, time, memo, visits) => ({ id: uid(), sample: true, name, phone, firstDate: addDays(next, -weeks * 7 * visits.length), cycleWeeks: weeks,

  state.customers.push(
    mk("김서연", "010-0000-0001", t, 4, "11:00", "뿌리염색", [1, 2]),

    mk("이민정", "010-0000-0003", addDays(t, 16), 8, "", "펌", [1, 2, 3]),

}

        <dt>주기</dt><dd>${c.cycleWeeks}주마다</dd>

      </dl>
      <button class="btn sms" type="button" data-act="week">💌 1주일 전 알림 문자 보내기</button>${statusOf(c, "week")}
      <button class="btn sms" type="button" data-act="day">💌 예약일 알림 문자 보내기</button>${statusOf(c, "day")}
      <button class="btn out" type="button" data-act="visit">✨ 방문 완료 · 다음 예약 잡기</button>
      <button class="btn out" type="button" data-act="cal">📅 휴대폰 캘린더에 알림 등록</button>
      <div class="row2"><button class="btn out" type="button" data-act="edit">수정</button><button class="btn danger" type="button" data-act="del">삭제</button></div>
      ${c.visits?.length ? `<div class="sec">방문 기록</div><p class="help">${c.visits.map(pretty).join(" · ")}</p>` : ""}`;
  };
  s = openSheet("고객 정보", "", el => el.addEventListener("click", e => {

  const already = isSent(c, k) ? `<div class="hint">이미 ${stamp(k === "week" ? c.weekSentAt : c.daySentAt)}에 보낸 알림이에요. 한 번 더 보낼 수 있어요.</div>` : "";
  openSheet(`${KIND[k]} 문자`, `
    <div class="card" style="cursor:default">${avatar(c.name)}<span class="l"><span class="n">${esc(c.name)}님께</span><span class="s" style="display:block">${esc(c.phone)}</span></span></div>
    ${already}
    <div class="field"><label for="msg">보낼 내용 (고쳐도 돼요)</label><textarea id="msg" rows="5">${esc(message(k, c))}</textarea></div>

}

    <div class="field"><label for="fMemo">메모 (선택)</label><textarea id="fMemo" rows="3" placeholder="시술 내용, 취향 등">${esc(v.memo)}</textarea></div>
    <div class="errmsg" id="fErr" hidden></div>
    <button class="btn fill" type="button" id="fSave">저장</button>`, s => {
    const q = sel => s.querySelector(sel);
    const weeks = () => { const n = parseInt(q("#fCycle").value, 10); return n >= 1 && n <= 52 ? n : null; };
    const upd = () => {
      const w = weeks();
      s.querySelectorAll(".chip").forEach(b => b.classList.toggle("on", +b.dataset.w === w));
      if (!w) { q("#fPrev").textContent = "주기는 1~52주 사이 숫자로 입력해 주세요."; return; }

      const f = q("#fFirst").value;
      if (!f) { q("#fPrev").textContent = "첫 예약날짜를 골라 주세요."; return; }
      const first = firstUpcoming(f, w);
      q("#fPrev").textContent = `첫 예약 ${pretty(first)} → 그다음 ${pretty(addDays(first, w * 7))} (${w}주 뒤)`;

    s.querySelectorAll(".chip").forEach(b => b.onclick = () => { q("#fCycle").value = b.dataset.w; upd(); });

      const name = q("#fName").value.trim(), phone = q("#fPhone").value.trim(), w = weeks(), first = q("#fFirst").value;
      const bad = { name: !name, phone: phone.replace(/\D/g, "").length < 9, cycle: !w };
      Object.entries(bad).forEach(([f, b]) => q(`[data-f="${f}"]`).classList.toggle("err", b));
      const msgs = [bad.name && "이름을 입력해 주세요", bad.phone && "전화번호를 확인해 주세요", bad.cycle && "주기를 1~52 사이로 입력해 주세요", !first && "첫 예약날짜를 골라 주세요"].filter(Boolean);
      q("#fErr").hidden = !msgs.length; q("#fErr").textContent = msgs.join(" · ");
      if (msgs.length) return;
      const data = { name, phone, firstDate: first, cycleWeeks: w, time: q("#fTime").value, memo: q("#fMemo").value.trim() };
      if (e) Object.assign(e, data, { nextDate: q("#fNext").value || e.nextDate });

      save(); closeSheet(); toast(e ? "수정했어요" : `${name}님을 등록했어요`);
    };
    if (!e) setTimeout(() => q("#fName").focus(), 300);
  });
}

/* ---------- 캘린더 알림 (.ics): 휴대폰 캘린더가 1주일 전·당일에 알려 준다 ---------- */
function addToCalendar(c) {
  const d = c.nextDate.replaceAll("-", ""), end = addDays(c.nextDate, 1).replaceAll("-", "");
  const now = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const text = s => s.replace(/[\\,;]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//salon-web//KO", "CALSCALE:GREGORIAN", "BEGIN:VEVENT",
    `UID:${c.id}-${d}@salon-web`, `DTSTAMP:${now}`, `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${end}`,
    `SUMMARY:${text(`${c.name}님 예약${c.time ? " " + c.time : ""}`)}`,
    `DESCRIPTION:${text(`${state.salonName} 예약 앱에서 알림 문자를 보내 주세요.\n${c.phone}`)}`,
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${text(`${c.name}님 1주일 전 알림 문자 보내기`)}`, "TRIGGER:-P6DT14H", "END:VALARM",
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${text(`${c.name}님 예약일 알림 문자 보내기`)}`, "TRIGGER:PT9H", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  download(new File([ics], `${c.name}-예약.ics`, { type: "text/calendar" }),
    "캘린더 파일을 열고 ‘추가’를 누르면, 예약 1주일 전 오전 10시와 당일 오전 9시에 휴대폰이 알려 줘요.");
}

/** 휴대폰에서는 공유 창(파일에 저장·카카오톡 등)을 먼저 띄우고, 안 되면 내려받는다. */
async function shareOrDownload(file, after) {
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: file.name }); if (after) toast(after); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  download(file, after);
}
function download(file, after) {
  const url = URL.createObjectURL(file);
  const a = document.createElement("a");
  a.href = url; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  if (after) toast(after);
}

/* ---------- 설정 ---------- */
function openSettings() {
  openSheet("설정", `
    <div class="field"><label for="sName">매장 이름</label><input id="sName" value="${esc(state.salonName)}"></div>
    <div class="sec">문자 문구</div>
    <p class="help">{이름} {날짜} {시간} {매장} 자리에 고객 정보가 들어가요.</p>
    <div class="field"><label for="sWeek">1주일 전 알림 문구</label><textarea id="sWeek" rows="4">${esc(state.weekTemplate)}</textarea></div>
    <div class="field"><label for="sDay">예약일 알림 문구</label><textarea id="sDay" rows="3">${esc(state.dayTemplate)}</textarea></div>
    <button class="linkbtn" type="button" id="sReset" style="align-self:flex-start">기본 문구로 되돌리기</button>
    <button class="btn fill" type="button" id="sSave">설정 저장</button>

    <div class="sec">데이터 백업</div>
    <p class="help">고객 정보는 이 휴대폰 안에만 저장돼요. 휴대폰을 바꾸거나 브라우저 데이터를 지우기 전에 백업 파일을 저장해 두세요.</p>
    <div class="row2"><button class="btn out" type="button" id="sExport">백업 저장</button><button class="btn out" type="button" id="sImport">백업 불러오기</button></div>
    <input type="file" id="sFile" accept=".json,application/json" hidden>

    <div class="sec">홈 화면에 추가</div>
    <button class="btn out" type="button" id="sHow">방법 보기</button>

    <div class="sec">초기화</div>
    <button class="btn danger" type="button" id="sWipe">모든 데이터 지우기</button>`, s => {
    const q = sel => s.querySelector(sel);
    q("#sReset").onclick = () => { q("#sWeek").value = DEFAULT_WEEK; q("#sDay").value = DEFAULT_DAY; };
    q("#sSave").onclick = () => {
      state.salonName = q("#sName").value.trim() || "우리 미용실";
      state.weekTemplate = q("#sWeek").value.trim() || DEFAULT_WEEK;
      state.dayTemplate = q("#sDay").value.trim() || DEFAULT_DAY;
      save(); closeSheet(); toast("저장했어요");
    };
    q("#sExport").onclick = () => shareOrDownload(
      new File([JSON.stringify({ app: "salon-web", version: 1, savedAt: new Date().toISOString(), ...state }, null, 2)], `미용실예약-백업-${todayStr()}.json`, { type: "application/json" }),
      "백업 파일을 저장했어요. 카카오톡 ‘나와의 채팅’이나 클라우드에도 보관해 두세요.");
    q("#sImport").onclick = () => q("#sFile").click();
    q("#sFile").onchange = async ev => {
      const f = ev.target.files[0]; ev.target.value = "";
      if (!f) return;
      let data;
      try { data = JSON.parse(await f.text()); if (!Array.isArray(data.customers)) throw 0; }
      catch { toast("백업 파일을 읽을 수 없어요"); return; }
      confirmBox({ title: "백업 불러오기", msg: `고객 ${data.customers.length}명이 들어 있는 백업으로 바꿔요.\n지금 있는 데이터는 지워져요.`, ok: "불러오기",
        onOk: () => {
          state = { salonName: data.salonName || "우리 미용실", weekTemplate: data.weekTemplate || DEFAULT_WEEK, dayTemplate: data.dayTemplate || DEFAULT_DAY, customers: data.customers };
          save(); closeSheet(); toast(`고객 ${data.customers.length}명을 불러왔어요`);
        } });
    };
    q("#sHow").onclick = openInstallHow;
    q("#sWipe").onclick = () => confirmBox({ title: "모든 데이터를 지울까요?", msg: "고객 정보와 설정이 모두 지워지고 되돌릴 수 없어요.\n먼저 백업을 저장해 두는 걸 권해요.", ok: "모두 지우기", danger: true,
      onOk: () => { state = { salonName: "우리 미용실", weekTemplate: DEFAULT_WEEK, dayTemplate: DEFAULT_DAY, customers: [] }; save(); closeSheet(); toast("모든 데이터를 지웠어요"); } });
  });
}

/* ---------- 홈 화면에 추가 안내 ---------- */
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function openInstallHow() {
  const android = `<ol class="steps"><li>크롬 또는 삼성 인터넷으로 이 페이지를 엽니다.</li><li>오른쪽 위 <b>⋮</b> (삼성 인터넷은 아래 <b>☰</b>) 메뉴를 누릅니다.</li><li><b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누릅니다.</li></ol>`;
  const ios = `<ol class="steps"><li><b>사파리</b>로 이 페이지를 엽니다.</li><li>아래쪽 <b>공유 버튼</b>(네모에 위쪽 화살표)을 누릅니다.</li><li><b>홈 화면에 추가</b>를 누르고 오른쪽 위 <b>추가</b>를 누릅니다.</li></ol>`;
  openSheet("홈 화면에 추가", `
    ${installEvt ? `<button class="btn fill" type="button" id="iNow">지금 바로 설치하기</button>` : ""}
    <div class="sec">${isIOS ? "아이폰" : "안드로이드(갤럭시)"}</div>${isIOS ? ios : android}
    <div class="sec">${isIOS ? "안드로이드(갤럭시)" : "아이폰"}</div>${isIOS ? android : ios}
    <p class="help">추가하고 나면 홈 화면의 <b>미용실 예약</b> 아이콘으로 열어 주세요. 인터넷이 잠깐 안 돼도 열려요.</p>`, s => {
    const b = s.querySelector("#iNow");
    if (b) b.onclick = async () => { installEvt.prompt(); await installEvt.userChoice; installEvt = null; closeSheet(); };
  });
}
$("#btnInstallHow").onclick = openInstallHow;
$("#btnInstallClose").onclick = () => { $("#installBanner").hidden = true; try { localStorage.setItem("salon.hideInstall", "1"); } catch {} };

/* ---------- 시작 ---------- */
load();
renderHome();
try { $("#installBanner").hidden = standalone() || localStorage.getItem("salon.hideInstall") === "1"; } catch { $("#installBanner").hidden = standalone(); }
navigator.storage?.persist?.().catch(() => {});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
// 날짜가 바뀌거나 다른 앱에서 돌아오면 다시 그린다
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshAll(); });
</script>
</body>
</html>
